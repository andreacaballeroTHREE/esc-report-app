<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESC Report App · THREE</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f0;color:#1a1a1a;min-height:100vh}
.screen{display:none;padding:16px;max-width:480px;margin:0 auto;padding-bottom:40px}
.screen.active{display:block}
.logo{font-size:12px;font-weight:600;color:#0F6E56;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:4px}
h1{font-size:22px;font-weight:600;margin-bottom:1.5rem;line-height:1.3;color:#1a1a1a}
h2{font-size:17px;font-weight:600;margin-bottom:1rem;color:#1a1a1a}
.card{background:#fff;border:1px solid #e5e7e5;border-radius:12px;padding:16px 18px;margin-bottom:12px}
label{font-size:13px;color:#555;display:block;margin-bottom:4px;font-weight:500}
input,select,textarea{width:100%;margin-bottom:14px;font-size:15px;padding:10px 12px;border:1px solid #d0d5d0;border-radius:8px;background:#fff;color:#1a1a1a;outline:none}
input:focus,select:focus,textarea:focus{border-color:#1D9E75}
textarea{height:72px;resize:none;font-family:inherit}
.btn{width:100%;padding:13px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;border:none;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity 0.15s}
.btn:active{opacity:0.8}
.btn-primary{background:#1D9E75;color:#fff}
.btn-secondary{background:#fff;color:#1a1a1a;border:1px solid #d0d5d0}
.btn-danger{background:#fee2e2;color:#b91c1c}
.btn+.btn{margin-top:8px}
.concept-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem}
.concept-btn{background:#fff;border:1px solid #e5e7e5;border-radius:10px;padding:12px 8px;text-align:center;cursor:pointer;font-size:12px;line-height:1.4;color:#1a1a1a;font-family:inherit}
.concept-btn:active{background:#f0f2f0}
.concept-btn i{display:block;font-size:24px;margin-bottom:6px;color:#1D9E75}
.entry-card{background:#fff;border:1px solid #e5e7e5;border-radius:10px;padding:10px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.entry-thumb{width:68px;height:68px;border-radius:8px;object-fit:cover;flex-shrink:0;background:#e5e7e5}
.entry-info{flex:1;min-width:0}
.entry-name{font-size:13px;font-weight:600;margin-bottom:2px}
.entry-time{font-size:11px;color:#777}
.entry-delete{background:none;border:none;color:#aaa;cursor:pointer;padding:2px;font-size:18px;line-height:1}
.badge{display:inline-block;font-size:12px;padding:3px 10px;border-radius:20px;background:#E1F5EE;color:#0F6E56;font-weight:600;margin-bottom:10px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:1.5rem}
.back-btn{background:#fff;border:1px solid #e5e7e5;border-radius:8px;cursor:pointer;color:#555;font-size:20px;padding:6px 8px;line-height:1;display:flex}
.step-indicator{font-size:12px;color:#888;margin-bottom:1px}
.divider{height:1px;background:#e5e7e5;margin:1rem 0}
.empty-state{text-align:center;padding:2.5rem 1rem;color:#888;font-size:14px}
.empty-state i{font-size:40px;display:block;margin-bottom:10px;opacity:0.3}
#photo-preview{margin-bottom:12px;display:none}
#photo-preview img{width:100%;border-radius:10px;display:block}
.ts-badge{font-size:11px;color:#777;margin-top:5px;padding-left:2px}
.summary-row{display:flex;justify-content:space-between;font-size:14px;padding:7px 0;border-bottom:1px solid #f0f0f0}
.summary-row:last-child{border-bottom:none}
.counter{background:#1D9E75;color:#fff;border-radius:50%;width:20px;height:20px;font-size:11px;display:inline-flex;align-items:center;justify-content:center;font-weight:600;margin-left:6px;vertical-align:middle}
.splash{padding-top:32px}
.splash-icon{width:56px;height:56px;background:#E1F5EE;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#1D9E75;margin-bottom:16px}
</style>
</head>
<body>

<div id="screen-home" class="screen active splash">
  <div class="splash-icon"><i class="ti ti-leaf"></i></div>
  <div class="logo">THREE · LEED BD+C</div>
  <h1>Reporte ESC<br><span style="color:#777;font-size:16px;font-weight:400">Construction Activity Pollution Prevention</span></h1>
  <div class="card">
    <label>Proyecto</label>
    <input type="text" id="proj-name" placeholder="Ej. Vesta Park Apodaca NL" />
    <label>No. de reporte</label>
    <input type="number" id="report-num" placeholder="Ej. 11" />
    <label>Elaborado por</label>
    <input type="text" id="elaborado-por" placeholder="Nombre completo" />
    <label>Frecuencia</label>
    <select id="frecuencia">
      <option value="Once per week">Once per week</option>
      <option value="Twice per week">Twice per week</option>
      <option value="Once per month">Once per month</option>
    </select>
  </div>
  <button class="btn btn-primary" onclick="goToCapture()"><i class="ti ti-arrow-right"></i>Iniciar captura de evidencia</button>
  <button class="btn btn-secondary" style="margin-top:8px" onclick="goToReview()">Ver entradas guardadas <span id="counter-badge" class="counter">0</span></button>
</div>

<div id="screen-concepts" class="screen">
  <div class="topbar">
    <button class="back-btn" onclick="showScreen('screen-home')"><i class="ti ti-arrow-left"></i></button>
    <div>
      <div class="step-indicator">Paso 1 de 2</div>
      <h2 style="margin-bottom:0">¿Qué vas a fotografiar?</h2>
    </div>
  </div>
  <div class="concept-grid" id="concept-grid"></div>
  <div class="divider"></div>
  <p style="font-size:12px;color:#888;margin-bottom:10px">¿No encuentras el concepto?</p>
  <button class="btn btn-secondary" onclick="goCustom()"><i class="ti ti-pencil"></i>Agregar concepto personalizado</button>
</div>

<div id="screen-photo" class="screen">
  <div class="topbar">
    <button class="back-btn" onclick="showScreen('screen-concepts')"><i class="ti ti-arrow-left"></i></button>
    <div>
      <div class="step-indicator">Paso 2 de 2</div>
      <h2 id="photo-screen-title" style="margin-bottom:0">Toma la foto</h2>
    </div>
  </div>
  <div class="badge" id="selected-concept-badge"></div>
  <div id="photo-preview"><img id="preview-img" /><div class="ts-badge" id="ts-badge-text"></div></div>
  <input type="file" id="file-input" accept="image/*" capture="environment" style="display:none" onchange="handlePhoto(event)" />
  <button class="btn btn-primary" onclick="document.getElementById('file-input').click()" id="photo-btn"><i class="ti ti-camera"></i>Tomar foto</button>
  <div id="notes-section" style="display:none;margin-top:14px">
    <label>Nota adicional (opcional)</label>
    <textarea id="extra-note" placeholder="Observación o acción correctiva..."></textarea>
    <button class="btn btn-primary" onclick="saveEntry()"><i class="ti ti-check"></i>Guardar y continuar</button>
  </div>
</div>

<div id="screen-custom" class="screen">
  <div class="topbar">
    <button class="back-btn" onclick="showScreen('screen-concepts')"><i class="ti ti-arrow-left"></i></button>
    <h2 style="margin-bottom:0">Concepto personalizado</h2>
  </div>
  <div class="card">
    <label>Actividad (español)</label>
    <input type="text" id="custom-es" placeholder="Ej. Revisión de cunetas perimetrales" />
    <label>Activity (English)</label>
    <input type="text" id="custom-en" placeholder="Ej. Perimeter ditch inspection" />
  </div>
  <button class="btn btn-primary" onclick="useCustomConcept()"><i class="ti ti-arrow-right"></i>Tomar foto de este concepto</button>
</div>

<div id="screen-review" class="screen">
  <div class="topbar">
    <button class="back-btn" onclick="showScreen('screen-home')"><i class="ti ti-arrow-left"></i></button>
    <h2 style="margin-bottom:0">Entradas del reporte</h2>
  </div>
  <div id="entries-list"></div>
  <button class="btn btn-secondary" onclick="goToCapture()"><i class="ti ti-plus"></i>Agregar otra entrada</button>
  <button class="btn btn-primary" onclick="generateReport()" id="export-btn" style="margin-top:8px"><i class="ti ti-file-text"></i>Generar reporte</button>
</div>

<div id="screen-report" class="screen">
  <div class="topbar">
    <button class="back-btn" onclick="showScreen('screen-review')"><i class="ti ti-arrow-left"></i></button>
    <h2 style="margin-bottom:0">Vista previa</h2>
  </div>
  <div class="card" id="report-meta-preview"></div>
  <div id="report-entries-preview"></div>
  <div class="card" style="margin-top:8px">
    <label>Acciones correctivas / Corrective actions</label>
    <textarea id="corrective-text" placeholder="Si no hay, escribe un guión: -"></textarea>
  </div>
  <button class="btn btn-primary" onclick="downloadReport()"><i class="ti ti-download"></i>Descargar reporte</button>
  <button class="btn btn-danger" onclick="resetAll()" style="margin-top:8px"><i class="ti ti-refresh"></i>Nuevo reporte (borra todo)</button>
</div>

<script>
const CONCEPTS = [
  {id:'llantas',icon:'ti-steering-wheel',es:'Lavadero de llantas',en:'Wheel washer cleaning',desc_es:'Se sigue realizando la limpieza del lava llantas para su mantenimiento, tomando las precauciones necesarias para evitar que el polvo y el lodo de los neumáticos se dispersen fuera del área de trabajo.',desc_en:'The wheel washer is still being cleaned for maintenance purposes, taking the necessary precautions to prevent dust and mud from the tires from dispersing outside the work area.'},
  {id:'camiones',icon:'ti-truck',es:'Camión con materiales cubiertos',en:'Trucks covered with tarps',desc_es:'Se verifica que todos los camiones que entran o salen de la obra estén cubiertos con lonas para prevenir la erosión y la contaminación ambiental.',desc_en:'All trucks entering or leaving the site are inspected to ensure they are covered with tarps to prevent erosion and environmental contamination.'},
  {id:'velocidad',icon:'ti-road-sign',es:'Límite de velocidad',en:'Speed limit signage',desc_es:'Se mantiene la señalización en el acceso de la obra para evitar que cualquier vehículo cause contaminación por polvo y partículas en suspensión al transitar por las vialidades.',desc_en:'Signage is maintained at the entrance to the site to prevent any vehicle from causing pollution by dust and suspended particles when travelling on the roads.'},
  {id:'peligrosos',icon:'ti-alert-triangle',es:'Almacén de residuos peligrosos',en:'Hazardous waste storage',desc_es:'Se mantiene una zona específica para la gestión y almacenamiento de residuos peligrosos, equipada con todas las medidas de seguridad necesarias para garantizar su correcta disposición y minimizar cualquier riesgo ambiental.',desc_en:'We maintain a specific area for the management and storage of hazardous waste, equipped with all the necessary security measures to ensure its correct disposal and minimize any environmental risk.'},
  {id:'sanitarios',icon:'ti-droplet',es:'Limpieza de sanitarios',en:'Sanitary cleaning',desc_es:'Se realizan limpiezas frecuentes para asegurar la higiene y minimizar la contaminación.',desc_en:'Frequent cleanings are carried out to ensure hygiene and minimise contamination.'},
  {id:'riegos',icon:'ti-plant-2',es:'Riegos en vialidades',en:'Road watering',desc_es:'Se siguen realizando riegos en las vialidades internas para evitar la dispersión de polvo en la obra.',desc_en:'Watering continues on internal roads to prevent dust from spreading on site.'},
  {id:'derrames',icon:'ti-first-aid-kit',es:'Kit anti derrames',en:'Spill kit',desc_es:'Se cuenta con un kit anti derrames en la obra para prevenir y controlar cualquier derrame en el área de residuos peligrosos, equipado con los materiales necesarios para una respuesta rápida y efectiva.',desc_en:'We have a spill kit on site to prevent and control any spills in the hazardous waste area, equipped with all the necessary materials for a fast and effective response.'},
  {id:'rsu',icon:'ti-trash',es:'Retiro de RSU',en:'Solid waste removal',desc_es:'Se retiran los residuos sólidos urbanos de los contenedores GEN cada semana.',desc_en:'Urban solid waste is removed from the GEN containers every week.'},
  {id:'geotextil',icon:'ti-barrier-block',es:'Malla geotextil',en:'Geotextile mesh',desc_es:'Se coloca/mantiene la malla geotextil en el perímetro para evitar la sedimentación de taludes.',desc_en:'Geotextile mesh is placed/maintained along the perimeter to prevent slope sedimentation.'},
  {id:'materiales',icon:'ti-stack',es:'Estibado de materiales',en:'Material storage (soil protection)',desc_es:'Todos los materiales utilizados en obra se encuentran estibados para evitar daños sobre el suelo.',desc_en:'All materials used in construction are stored to avoid damage to the soil.'},
];

let entries = [];
let selectedConcept = null;
let currentPhotoData = null;
let currentTimestamp = null;

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function updateCounter(){
  document.getElementById('counter-badge').textContent=entries.length;
}

function goToCapture(){
  showScreen('screen-concepts');
  renderConcepts();
}

function renderConcepts(){
  const grid=document.getElementById('concept-grid');
  grid.innerHTML=CONCEPTS.map(c=>`<button class="concept-btn" onclick="selectConcept('${c.id}')"><i class="ti ${c.icon}"></i>${c.es}</button>`).join('');
}

function selectConcept(id){
  selectedConcept=CONCEPTS.find(c=>c.id===id);
  openPhotoScreen();
}

function goCustom(){showScreen('screen-custom');}

function useCustomConcept(){
  const es=document.getElementById('custom-es').value.trim();
  const en=document.getElementById('custom-en').value.trim();
  if(!es||!en){alert('Escribe el concepto en ambos idiomas.');return;}
  selectedConcept={id:'custom_'+Date.now(),icon:'ti-pencil',es,en,desc_es:es,desc_en:en};
  openPhotoScreen();
}

function openPhotoScreen(){
  currentPhotoData=null;currentTimestamp=null;
  document.getElementById('photo-screen-title').textContent=selectedConcept.es;
  document.getElementById('selected-concept-badge').textContent=selectedConcept.es;
  document.getElementById('photo-preview').style.display='none';
  document.getElementById('notes-section').style.display='none';
  document.getElementById('photo-btn').innerHTML='<i class="ti ti-camera"></i>Tomar foto';
  document.getElementById('extra-note').value='';
  showScreen('screen-photo');
}

function handlePhoto(e){
  const file=e.target.files[0];
  if(!file)return;
  const now=new Date();
  currentTimestamp=now;
  const pad=n=>String(n).padStart(2,'0');
  const tsText=`${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  const reader=new FileReader();
  reader.onload=ev=>{
    currentPhotoData=ev.target.result;
    document.getElementById('preview-img').src=currentPhotoData;
    document.getElementById('photo-preview').style.display='block';
    document.getElementById('ts-badge-text').textContent='📅 '+tsText;
    document.getElementById('photo-btn').innerHTML='<i class="ti ti-camera-rotate"></i>Cambiar foto';
    document.getElementById('notes-section').style.display='block';
  };
  reader.readAsDataURL(file);
  e.target.value='';
}

function saveEntry(){
  if(!currentPhotoData){alert('Toma una foto primero.');return;}
  const note=document.getElementById('extra-note').value.trim();
  const now=currentTimestamp||new Date();
  const pad=n=>String(n).padStart(2,'0');
  const dateStr=`${pad(now.getMonth()+1)}/${pad(now.getDate())}/${now.getFullYear()}`;
  const tsStr=`${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  entries.push({concept:selectedConcept,photo:currentPhotoData,date:dateStr,timestamp:tsStr,note});
  updateCounter();
  showScreen('screen-concepts');
  renderConcepts();
}

function goToReview(){renderEntries();showScreen('screen-review');}

function renderEntries(){
  const list=document.getElementById('entries-list');
  if(entries.length===0){
    list.innerHTML='<div class="empty-state"><i class="ti ti-inbox"></i>No hay entradas aún.<br>Agrega conceptos desde el inicio.</div>';
    document.getElementById('export-btn').style.opacity='0.4';
    document.getElementById('export-btn').disabled=true;
    return;
  }
  document.getElementById('export-btn').style.opacity='1';
  document.getElementById('export-btn').disabled=false;
  list.innerHTML=entries.map((e,i)=>`
    <div class="entry-card">
      <img class="entry-thumb" src="${e.photo}" />
      <div class="entry-info">
        <div class="entry-name">${e.concept.es}</div>
        <div class="entry-time">${e.timestamp}</div>
        ${e.note?`<div style="font-size:11px;color:#888;margin-top:2px">${e.note}</div>`:''}
      </div>
      <button class="entry-delete" onclick="deleteEntry(${i})" aria-label="Eliminar"><i class="ti ti-trash"></i></button>
    </div>`).join('');
}

function deleteEntry(i){
  if(confirm('¿Eliminar esta entrada?')){entries.splice(i,1);updateCounter();renderEntries();}
}

function generateReport(){
  if(entries.length===0)return;
  const proj=document.getElementById('proj-name').value||'—';
  const num=document.getElementById('report-num').value||'—';
  const elab=document.getElementById('elaborado-por').value||'—';
  const freq=document.getElementById('frecuencia').value;
  const today=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const sentDate=`${pad(today.getMonth()+1)}/${pad(today.getDate())}/${today.getFullYear()}`;
  document.getElementById('report-meta-preview').innerHTML=`
    <div class="summary-row"><span>Proyecto</span><span style="font-weight:600">${proj}</span></div>
    <div class="summary-row"><span>No. de reporte</span><span style="font-weight:600">${num}</span></div>
    <div class="summary-row"><span>Elaborado por</span><span style="font-weight:600">${elab}</span></div>
    <div class="summary-row"><span>Fecha</span><span style="font-weight:600">${sentDate}</span></div>
    <div class="summary-row"><span>Frecuencia</span><span style="font-weight:600">${freq}</span></div>
    <div class="summary-row"><span>Entradas</span><span style="font-weight:600">${entries.length}</span></div>`;
  document.getElementById('report-entries-preview').innerHTML=entries.map((e,i)=>`
    <div class="card" style="margin-bottom:8px">
      <div style="font-size:13px;font-weight:600;margin-bottom:6px">${i+1}. ${e.concept.es}</div>
      <img src="${e.photo}" style="width:100%;border-radius:8px;margin-bottom:6px;max-height:150px;object-fit:cover" />
      <div style="font-size:11px;color:#777">${e.timestamp}</div>
      ${e.note?`<div style="font-size:12px;margin-top:4px;color:#555">${e.note}</div>`:''}
    </div>`).join('');
  showScreen('screen-report');
}

function downloadReport(){
  const proj=document.getElementById('proj-name').value||'—';
  const num=document.getElementById('report-num').value||'—';
  const elab=document.getElementById('elaborado-por').value||'—';
  const freq=document.getElementById('frecuencia').value;
  const corrective=document.getElementById('corrective-text').value||'-';
  const today=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const sentDate=`${pad(today.getMonth()+1)}/${pad(today.getDate())}/${today.getFullYear()}`;

  const rows=entries.map(e=>`
    <tr>
      <td style="width:20%;font-weight:600;font-size:10px;vertical-align:top;padding:6px 8px;border:1px solid #ccc">${e.concept.es}</td>
      <td style="width:24%;font-size:9px;vertical-align:top;padding:6px 8px;border:1px solid #ccc">${e.concept.desc_es}${e.note?'<br><br><em>'+e.note+'</em>':''}</td>
      <td style="width:24%;font-size:9px;vertical-align:top;padding:6px 8px;border:1px solid #ccc">${e.concept.desc_en}${e.note?'<br><br><em>'+e.note+'</em>':''}</td>
      <td style="width:24%;vertical-align:top;padding:4px;border:1px solid #ccc;text-align:center"><img src="${e.photo}" style="width:100%;max-height:100px;object-fit:cover;border-radius:4px" /><div style="font-size:8px;color:#777;margin-top:3px">${e.timestamp}</div></td>
      <td style="width:8%;font-size:9px;vertical-align:top;padding:6px 8px;border:1px solid #ccc;text-align:center">${e.date}</td>
    </tr>`).join('');

  const reportHTML=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>ESC Report ${num} - ${proj}</title>
  <style>
    body{font-family:Arial,sans-serif;margin:0;padding:20px;font-size:11px;color:#1a1a1a}
    .header{background:#1D5C3E;color:white;padding:14px 18px;border-radius:6px 6px 0 0;display:flex;justify-content:space-between;align-items:flex-start}
    .header h1{font-size:15px;margin:0 0 2px;color:white}
    .header p{font-size:10px;margin:0;opacity:0.85}
    .header .brand{font-size:13px;font-weight:700;color:white;opacity:0.9}
    table.meta{width:100%;border-collapse:collapse;border:1px solid #ccc;border-top:none}
    table.meta td{padding:5px 10px;border:1px solid #ccc;font-size:10px}
    table.meta .lbl{background:#f5f7f5;font-weight:700;width:130px}
    table.main{width:100%;border-collapse:collapse;margin-top:14px}
    table.main th{background:#1D5C3E;color:white;padding:6px 8px;text-align:left;font-size:10px;font-weight:600}
    .corrective{margin-top:12px;border:1px solid #ccc;border-radius:4px;padding:10px;font-size:10px}
    .corrective strong{display:block;margin-bottom:4px}
    .footer{margin-top:10px;font-size:9px;color:#888;text-align:right}
    @media print{body{padding:10px}@page{margin:15mm}}
  </style></head><body>
  <div class="header">
    <div>
      <p style="font-size:9px;opacity:0.75;margin-bottom:3px;text-transform:uppercase;letter-spacing:0.05em">Sustainable Sites</p>
      <h1>Construction Activity Pollution Prevention Prerequisite</h1>
      <p>ESC Monthly Report</p>
    </div>
    <div class="brand">THREE</div>
  </div>
  <table class="meta"><tr>
    <td class="lbl">Report Number:</td><td>${num}</td>
    <td class="lbl">Elaborated by:</td><td>${elab}</td>
    <td class="lbl">Sent date:</td><td>${sentDate}</td>
  </tr><tr>
    <td class="lbl">Project:</td><td colspan="3">${proj}</td>
    <td class="lbl">Frequency:</td><td>${freq}</td>
  </tr></table>
  <table class="main"><thead><tr>
    <th>Actividades realizadas</th><th>Descripción (ES)</th><th>Description (EN)</th><th>Photo report</th><th>Date</th>
  </tr></thead><tbody>${rows}</tbody></table>
  <div class="corrective"><strong>Corrective Actions / Acciones Correctivas:</strong>${corrective}</div>
  <div class="footer">* Full size images can also be found on the credit uploads</div>
  <script>window.onload=function(){window.print();}<\/script>
  </body></html>`;

  const blob=new Blob([reportHTML],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='ESC_Report_'+proj.replace(/\s+/g,'_')+'_No'+num+'.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function resetAll(){
  if(confirm('¿Iniciar reporte nuevo? Se borrarán todas las entradas.')){
    entries=[];updateCounter();showScreen('screen-home');
  }
}
</script>
